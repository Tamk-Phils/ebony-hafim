version: '3.8'

# ==============================================================================
# HA-FIM: Hardware-Assisted File Integrity Monitoring
# Cross-Platform Cloud & Container Orchestration (Linux & Windows)
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - TEE_MODE=${TEE_MODE:-DEVELOPMENT_SOFTWARE_ONLY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./hafim.db}
      - SECRET_KEY=${SECRET_KEY:-hafim_production_research_key_change_in_production}
      - RECONCILIATION_INTERVAL_SECONDS=15
      - AGENT_HEARTBEAT_TIMEOUT_SECONDS=30
    volumes:
      - ./sandbox:/app/sandbox
      - ./test_sandbox:/app/test_sandbox
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

