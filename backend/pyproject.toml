[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hafim-backend"
version = "1.0.0"
description = "FastAPI backend for Hardware-Assisted File Integrity Monitoring"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "websockets>=14.0",
    "psutil>=6.1.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0"
]

[tool.vercel]
entrypoint = "main:app"
